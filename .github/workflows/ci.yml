name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal script)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Check release and update tooling
        run: |
          for file in script/*.sh; do bash -n "$file"; done
          python3 -m unittest discover -s script -p '*_test.py' -v
      - name: Build the MyGo desktop bundle
        if: runner.os == 'macOS'
        run: ./script/package-desktop.sh
      - name: Verify desktop installer and MyGo updates
        if: runner.os == 'macOS'
        run: python3 script/smoke_desktop_update.py

  installer:
    name: Linux installer smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: python3 script/smoke_install_server.py --user-install
