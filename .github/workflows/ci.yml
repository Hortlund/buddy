name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal script)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Check release and update tooling
        run: |
          for file in script/*.sh; do bash -n "$file"; done
          python3 -m unittest discover -s script -p '*_test.py' -v
      - name: Build the MyGo desktop bundle
        if: runner.os == 'macOS'
        run: ./script/package-desktop.sh
      - name: Verify review window lifecycle
        if: runner.os == 'macOS'
        run: go test -race -tags e2e ./cmd/buddy -run '^TestPatchReviewWindowLifecycle$' -count=1
      - name: Verify desktop installer and MyGo updates
        if: runner.os == 'macOS'
        run: python3 script/smoke_desktop_update.py

  installer:
    name: Linux installer smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: python3 script/smoke_install_server.py --user-install
